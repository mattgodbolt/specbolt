repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: .idea
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: mixed-line-ending
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.6
    hooks:
      # The hook also claims JavaScript and JSON, which .clang-format is not written for.
      - id: clang-format
        types_or: [c, c++]
  - repo: local
    hooks:
      - id: format-cpu-table
        name: align .cpu instruction table columns
        entry: tools/format_cpu_table.py
        language: python
        files: \.cpu$
